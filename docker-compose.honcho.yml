services:
  # --- Honcho build-from-source override ---
  # Overrides the prebuilt-image `honcho` service from docker-compose.yml.
  # Usage: docker compose -f docker-compose.yml -f docker-compose.honcho.yml up -d
  # See docs/HONCHO_SETUP.md for full instructions
  honcho:
    image: honcho-repo-api:latest
    build:
      context: vendor/honcho
      dockerfile: Dockerfile
    entrypoint: ["sh", "docker/entrypoint.sh"]
    ports:
      - "8081:8000"
    env_file:
      - .env.honcho
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_DB_PASSWORD:-REPLACE_WITH_SECURE_PASSWORD}@honcho-db:5432/honcho
      CACHE_ENABLED: "true"
      METRICS_ENABLED: "false"
    volumes:
      - ./honcho/config.toml:/app/config.toml:ro
